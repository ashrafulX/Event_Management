{% block navs %}
<header class="fixed top-0 left-0 w-full z-50 text-white">
    <div class="top-bar flex justify-end md:justify-between px-4 md:px-10 bg-black py-2">
        <div class="hidden md:flex gap-6 text-white text-sm">
            <div class="flex gap-2 text-white">
                <span>
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="w-4 h-4">
                        <path fill-rule="evenodd" d="M1.5 4.5a3 3 0 0 1 3-3h1.372c.86 0 1.61.586 1.819 1.42l1.105 4.423a1.875 1.875 0 0 1-.694 1.955l-1.293.97c-.135.101-.164.249-.126.352a11.285 11.285 0 0 0 6.697 6.697c.103.038.25.009.352-.126l.97-1.293a1.875 1.875 0 0 1 1.955-.694l4.423 1.105c.834.209 1.42.959 1.42 1.82V19.5a3 3 0 0 1-3 3h-2.25C8.552 22.5 1.5 15.448 1.5 6.75V4.5Z" clip-rule="evenodd" />
                    </svg>
                </span>
                <span>+8801234567899</span>
            </div>
            <div class="flex gap-2 text-white">
                <span>
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="w-4 h-4">
                        <path d="M1.5 8.67v8.58a3 3 0 0 0 3 3h15a3 3 0 0 0 3-3V8.67l-8.928 5.493a3 3 0 0 1-3.144 0L1.5 8.67Z" />
                        <path d="M22.5 6.908V6.75a3 3 0 0 0-3-3h-15a3 3 0 0 0-3 3v.158l9.714 5.978a1.5 1.5 0 0 0 1.572 0L22.5 6.908Z" />
                    </svg>
                </span>
                <span>ashrafulwho@gmail.com</span>
            </div>
        </div>
        {% if user.is_authenticated %}
        <div class='flex gap-6 text-white text-sm'>
        <a href="{% url "profile" %}"><span>{{user}}</span></a>
        <span>
            <form action="{% url "logout" %}" method='POST'>
                {% csrf_token %}
                <button type='submit'>Logout</button>
            </form>
        </span>
        </div>
        {% else %}
        <div class="flex gap-3 text-white text-sm">
            Anonymous
            <a href=" {% url "sign-in" %}" class="hover:underline">Sign In</a>
            <span> | </span>
            <a href=" {% url "sign-up" %} " class="hover:underline">Sign Up</a>
        </div>
        {% endif %}
    </div>


 <nav class="px-4 md:px-20 py-4 relative bg-black/40 backdrop-blur-md border-b border-white/10 transition-all duration-300">
    <div class="flex justify-between items-center">
        
        <div class="text-white">
            <h1 class="text-3xl md:text-4xl font-black tracking-widest uppercase">
                <a href="{% url "dashboard" %}">EVENT<span class="text-[#F56529]">.</span></a>
            </h1>
        </div>
        
        <button id="menu-btn" class="block md:hidden text-white focus:outline-none hover:text-[#F56529] transition-colors">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
            </svg>
        </button>

        <div id="menu" class="hidden md:flex absolute md:static top-full left-0 w-full md:w-auto bg-[#111111]/95 md:bg-transparent backdrop-blur-lg md:backdrop-blur-none flex-col md:flex-row items-start md:items-center gap-6 md:gap-8 text-xs font-bold uppercase tracking-[0.15em] text-gray-300 p-6 md:p-0 z-50 border-t border-white/10 md:border-none shadow-xl md:shadow-none">
            
            <a href="{% url 'past-events' %}" class="hover:text-[#F56529] transition-colors duration-300">Past Event</a>
            <a href="{% url 'upcoming-events' %}" class="hover:text-[#F56529] transition-colors duration-300">Upcoming Event</a>
            <a href="{% url 'all-event' %}" class="hover:text-[#F56529] transition-colors duration-300">All Event</a>
            <a href="#search-section" class="hover:text-[#F56529] transition-colors duration-300">Search</a>
            
            <a href="#contact-section" class="px-6 py-2.5 bg-[#F56529] text-white rounded-full hover:bg-white hover:text-black transition-all duration-300 mt-2 md:mt-0 text-center shadow-[0_0_15px_rgba(245,101,41,0.4)]">
                Contact
            </a>

        </div>
    </div>
</nav>  
</header>
{% endblock navs %}
