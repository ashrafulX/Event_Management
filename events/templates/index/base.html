{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <link rel="stylesheet" href="{% static 'css/output.css' %}">
    <style>
        html {
            scroll-behavior: smooth;
        }
    </style>
</head>
<body class="bg-white">

    {% include "index/nav.html" %}
<section id="search-section" class="scroll-mt-32 relative w-full min-h-screen bg-cover bg-center text-white pt-[200px] md:pt-[150px] px-4 md:px-20 flex flex-col justify-center items-center" style="background-image: url('{% static 'images/event.jpg' %}');">
    
    <div class="absolute inset-0 bg-[#DB3B24]/85"></div>

    <div class="relative z-10 text-center flex flex-col items-center gap-6 w-full">
        <div>
            <h1 class="text-3xl md:text-5xl font-bold">Make Your Dream Come True</h1>
            <h3 class="text-base md:text-xl mt-3">Meet your Favorite Player, sport teams and parties</h3>
        </div>

        <div class="w-full max-w-2xl mt-4 px-8 md:px-0">
            <form action="{% url 'search' %}" method="GET">
        <input type="text" name="q" value="{{ request.GET.q|default:'' }}" placeholder="Search Artist, Team, Venue" class="w-full px-6 py-3 md:py-5 rounded-full bg-transparent border border-white text-white placeholder-white/70 outline-none text-sm md:text-base">
    </form>
        </div>
        
        <div>
            <h2 class="text-lg md:text-2xl font-semibold">Dhaka, Bangladesh</h2>
        </div>
    </div>
</section>


<main>
    {% block content %}
    {% endblock content %}
</main>



{% include "index/footer.html" %}


<script>
    const menuBtn = document.getElementById('menu-btn');
    const menu = document.getElementById('menu');

    menuBtn.addEventListener('click', () => {
        menu.classList.toggle('hidden');
        menu.classList.toggle('flex');
    });
</script>

</body>
</html>
