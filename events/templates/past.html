{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Past Events</title>
    <link rel="stylesheet" href="{% static 'css/output.css' %}">
</head>
<body class="bg-gray-50 text-gray-900 font-sans min-h-screen flex flex-col">
    
    {% include "index/nav.html" %}
    
    <main class="flex-grow max-w-7xl mx-auto px-4 sm:px-6 lg:px-20 w-full mt-16 md:mt-28 mb-16">
        
        <div class="mb-8">
            <h2 class="text-2xl md:text-3xl font-black uppercase tracking-wide text-black">
                Past Events
            </h2>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-8 items-start">
            {% for event in events %}
                {% include "event_card.html" %}
            {% empty %}
                <div class="col-span-full py-16 text-center">
                    <p class="text-gray-500 text-lg font-semibold">There are no past events to display.</p>
                </div>
            {% endfor %}
        </div>
        
    </main>
</body>
</html>
