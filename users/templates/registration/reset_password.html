{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password</title>
    <link rel="stylesheet" href="{% static 'css/output.css' %}">
</head>
<body class="bg-gray-50 text-gray-900 font-sans min-h-screen flex flex-col">
    
    {% include "index/nav.html" %}

    <main class="flex-grow w-full max-w-md mx-auto px-4 mt-28 mb-16 flex flex-col">
        
        {% if messages %}
        <div class="w-full flex flex-col gap-3 mb-6">
            {% for message in messages %}
            <div class="p-4 rounded-xl text-sm font-semibold flex items-center gap-3 border transition-all duration-300 transform hover:scale-[1.02] shadow-sm 
                {% if message.tags == 'success' %} bg-green-50 text-green-700 border-green-200 shadow-green-600/10 
                {% elif message.tags == 'error' %} bg-red-50 text-red-700 border-red-200 shadow-red-600/10 
                {% elif message.tags == 'warning' %} bg-yellow-50 text-yellow-700 border-yellow-200 shadow-yellow-600/10 
                {% else %} bg-blue-50 text-blue-700 border-blue-200 shadow-blue-600/10 {% endif %}">
                
                <span class="flex-shrink-0 w-2.5 h-2.5 rounded-full animate-pulse 
                    {% if message.tags == 'success' %} bg-green-500 
                    {% elif message.tags == 'error' %} bg-red-500 
                    {% elif message.tags == 'warning' %} bg-yellow-500 
                    {% else %} bg-blue-500 {% endif %}"></span>
                
                <span class="flex-1">{{ message }}</span>
            </div>
            {% endfor %}
        </div>
        {% endif %}

        <div class="w-full bg-white p-8 rounded-2xl shadow-sm border border-gray-100">
            <h2 class="text-2xl font-black uppercase tracking-wide text-center text-black mb-6">
                Reset Password
            </h2>
            
            <form method="POST" class="flex flex-col gap-4">
                {% csrf_token %}
                
                <div class="w-full 
                    [&_label]:block [&_label]:mb-1.5 [&_label]:text-sm [&_label]:font-bold [&_label]:text-gray-700 
                    [&_input]:w-full [&_input]:px-4 [&_input]:py-3 [&_input]:border [&_input]:border-gray-300 
                    [&_input]:rounded-lg [&_input]:text-gray-800 [&_input]:focus:ring-2 [&_input]:focus:ring-orange-500 
                    [&_input]:focus:border-orange-500 [&_input]:outline-none [&_input]:transition-all [&_input]:shadow-sm">
                    
                    {{ form }}
                </div>

                <button class="mt-4 w-full bg-orange-500 hover:bg-orange-600 transition-colors duration-200 text-white font-bold py-3 px-4 rounded-lg shadow-md" type="submit">
                    Submit
                </button>
            </form>
        </div>
        
    </main>
</body>
</html>
