{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Authentication System</title>
    <link rel="stylesheet" href="{% static 'css/output.css' %}">
</head>
<body class="bg-gradient-to-br from-slate-100 via-indigo-50 to-purple-100 min-h-screen flex items-center justify-center font-sans text-slate-800 antialiased p-4">

    <div class="w-full max-w-md p-8 bg-white rounded-2xl shadow-xl border border-slate-100">
        
        <div class="text-center mb-8">
            <h1 class="text-3xl font-extrabold text-transparent bg-clip-text text-blue-600 tracking-tight">
                Welcome Back
            </h1>
            <p class="text-sm text-slate-500 mt-2">Sign in to your account to continue</p>
        </div>

        <form method="POST" class="flex flex-col gap-5">
            {% csrf_token %}
            
          <div class="flex flex-col gap-1.5">
            <label for="{{ form.username.id_for_label }}" class="text-sm font-semibold text-slate-700">
                Username
            </label>
            {{ form.username }}
        </div>

            <div class="flex flex-col gap-1.5">
                
            <label for="{{ form.password.id_for_label }}" class="text-sm font-semibold text-slate-700">{{form.password}}</label>
               <a href="#" class="text-sm font-medium text-blue-600 hover:text-blue-500 transition-colors">
                    Forgot password?
                </a>
            </div>
            
            <button type="submit" 
                    class="w-full mt-2 py-3 px-4 bg-blue-600 hover:from-indigo-700 hover:to-blue-700 text-white font-semibold rounded-lg shadow-md hover:shadow-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:ring-offset-2 active:scale-[0.98]">
                Sign In
            </button>
        </form>
        
        <p class="mt-8 text-center text-sm text-slate-600">
            Don't have an account? 
            <a href=" {% url "sign-up" %}" class="font-semibold text-blue-600 hover:text-indigo-500 hover:underline transition-colors">
                Sign up
            </a>
        </p>

    </div>

</body>
</html>
